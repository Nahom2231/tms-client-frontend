<div class = "course-card" [class.closed]= "course().enrollmentCount >= course().maxCapacity">
    <h3>
        <a [routerLink]="['/courses', course().id]">{{ course().title }}</a>
        ({{course().code}})
    </h3>
    <p>Enrolled {{ course().enrollmentCount }} of {{ course().maxCapacity }} seats </p>
    <p class = "status">
        {{ course().enrollmentCount >= course().maxCapacity? "Full" : "Accepting enrollments" }}
    </p>

    <button
    (click)="enrollClicked.emit(course())"
    [disabled]="course().enrollmentCount>= course().maxCapacity">
    Enroll
</button>
</div>
